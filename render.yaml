services:
  - type: web
    name: ai-chat-service
    runtime: node
    plan: free
    rootDir: backend-ai-chat
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
